[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsoc-contrib"
version = "0.2.0"
description = "Fast, lightweight contribution workspace manager for GitHub issues without full clones."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Anand" }
]
keywords = ["git", "github", "developer-tools", "cli", "sparse-checkout", "open-source", "gsoc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]

[project.scripts]
contrib = "contrib.cli:main"

[project.urls]
Homepage = "https://github.com/anandmahadevv/contrib-cli"
Repository = "https://github.com/anandmahadevv/contrib-cli.git"
"Bug Tracker" = "https://github.com/anandmahadevv/contrib-cli/issues"
Changelog = "https://github.com/anandmahadevv/contrib-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/contrib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
