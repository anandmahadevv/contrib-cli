  <!-- Initialize theme before body render to avoid theme flicker -->

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICONS ---

    const SunIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />

    );

    const MoonIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>

    const SlidersIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4" x2="4" y1="21" y2="14" /><line x1="4" x2="4" y1="10" y2="3" /><line x1="12" x2="12" y1="21" y2="12" /><line x1="12" x2="12" y1="8" y2="3" /><line x1="20" x2="20" y1="21" y2="16" /><line x1="20" x2="20" y1="12" y2="3" /><line x1="1" x2="7" y1="14" y2="14" /><line x1="9" x2="15" y1="8" y2="8" /><line x1="17" x2="23" y1="16" y2="16" />
      </svg>
    );

    const HardDriveIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="22" x2="2" y1="12" y2="12" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /><line x1="6" x2="6.01" y1="16" y2="16" /><line x1="10" x2="10.01" y1="16" y2="16" />
      </svg>
    );

    const LayersIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
      </svg>
    );

    const ZapIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    );

    const CopyIcon = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>
    );

    const CheckIcon = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    );

    const HighlightText = ({ text, highlight }) => {
      if (!highlight || !highlight.trim()) return <span>{text}</span>;
      const terms = highlight.trim().split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (terms.length === 0) return <span>{text}</span>;
      const regex = new RegExp(`(${terms.join('|')})`, 'gi');
      const parts = text.split(regex);
      return (
        <span>
          {parts.map((part, i) =>
            regex.test(part) ? (
              <mark key={i} className="bg-amber-200/90 dark:bg-amber-400 text-slate-900 font-semibold px-0.5 rounded-xs">
                {part}
              </mark>
            ) : (
              part
            )
          )}
        </span>
      );
    };

    const CodeBlock = ({ code, language = "bash" }) => {
      const [copied, setCopied] = useState(false);

      const onCopy = () => {
        navigator.clipboard.writeText(code);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="relative my-4 rounded-xl bg-slate-900 dark:bg-slate-950 border border-slate-800 text-slate-100 overflow-hidden font-mono text-sm shadow-xs group">
          <div className="flex items-center justify-between px-4 py-2 bg-slate-950/70 border-b border-slate-800 text-xs text-slate-400">
            <span>{language}</span>
            <button
              onClick={onCopy}
              className="flex items-center gap-1 text-slate-400 hover:text-white transition-colors py-0.5 px-2 rounded hover:bg-slate-800 cursor-pointer"
            >
              {copied ? (
                <>
                  <CheckIcon className="w-3.5 h-3.5 text-emerald-400" />
                  <span className="text-emerald-400 font-semibold">Copied</span>
                </>
              ) : (
                <>
                  <CopyIcon className="w-3.5 h-3.5" />
                  <span>Copy</span>
                </>
              )}
            </button>
          </div>
          <pre className="p-4 overflow-x-auto text-xs sm:text-sm leading-relaxed">
            <code>{code}</code>
          </pre>
        </div>
      );
    };

    const Callout = ({ type = "note", title, children }) => {
      const styles = {
        note: "bg-blue-50/70 dark:bg-blue-950/40 border-blue-200 dark:border-blue-900 text-blue-900 dark:text-blue-200",
        tip: "bg-emerald-50/70 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900 text-emerald-900 dark:text-emerald-200",
        warning: "bg-amber-50/70 dark:bg-amber-950/40 border-amber-200 dark:border-amber-900 text-amber-900 dark:text-amber-200",
        security: "bg-purple-50/70 dark:bg-purple-950/40 border-purple-200 dark:border-purple-900 text-purple-900 dark:text-purple-200",
      };

      return (
        <div className={`my-5 p-4 rounded-xl border ${styles[type]} text-sm leading-relaxed`}>
          {title && <div className="font-semibold mb-1 text-xs uppercase tracking-wider">{title}</div>}
          <div>{children}</div>
        </div>
      );
    };

    // --- INTERACTIVE TOOL 1: PACKAGE MANAGER TABS ---
    const PackageManagerTabs = () => {
      const [activeTab, setActiveTab] = useState('npx');
      const [copied, setCopied] = useState(false);

      const managers = {
        npx: {
          label: 'npx',
          badge: 'Zero Install',
          command: 'npx gsoc-contrib start https://github.com/psf/requests/issues/6000 --worktree',
          note: 'Runs on-demand without permanent global install. Requires Node.js 18+.'
        },
        npm: {
          label: 'npm',
          badge: 'Global CLI',
          command: 'npm install -g gsoc-contrib',
          note: 'Provides both contrib and gsoc-contrib commands in your system PATH.'
        },
        pnpm: {
          label: 'pnpm',
          badge: 'Fast & Space-Efficient',
          command: 'pnpm add -g gsoc-contrib',
          note: 'Installs globally using pnpm content-addressable storage.'
        },
        bun: {
          label: 'bun',
          badge: 'Sub-second Install',
          command: 'bun add -g gsoc-contrib',
          note: 'Instant global installation using the Bun JavaScript runtime.'
        },
        pip: {
          label: 'pip (Python)',
          badge: 'PyPI Package',
          command: 'pip install contrib-cli',
          note: 'Designed for Python environments and data science open-source contributors.'
        }
      };

      const current = managers[activeTab];

      const handleCopy = () => {
        navigator.clipboard.writeText(current.command);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="my-6 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40 p-4 sm:p-5">
          <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-200 dark:border-slate-800">
            <div className="flex items-center gap-1.5 p-1 bg-slate-200/70 dark:bg-slate-800 rounded-xl overflow-x-auto text-xs font-mono">
              {Object.keys(managers).map(key => (
                <button
                  key={key}
                  onClick={() => { setActiveTab(key); setCopied(false); }}
                  className={`px-3 py-1.5 rounded-lg font-semibold transition-all cursor-pointer ${
                    activeTab === key
                      ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  {managers[key].label}
                </button>
              ))}
            </div>
            <span className="text-[11px] font-mono font-medium px-2.5 py-1 rounded-full bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-900">
              {current.badge}
            </span>
          </div>

          <div className="mt-4">
            <div className="flex items-center justify-between gap-2 p-3 bg-slate-900 dark:bg-slate-950 text-slate-100 rounded-xl font-mono text-xs sm:text-sm border border-slate-800">
              <code className="truncate text-emerald-400 select-all">$ {current.command}</code>
              <button
                onClick={handleCopy}
                className="shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs transition-colors cursor-pointer"
              >
                {copied ? (
                  <>
                    <CheckIcon className="w-3.5 h-3.5 text-emerald-400" />
                    <span className="text-emerald-400">Copied</span>
                  </>
                ) : (
                  <>
                    <CopyIcon className="w-3.5 h-3.5" />
                    <span>Copy</span>
                  </>
                )}
              </button>
            </div>
            <p className="mt-2 text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
              <span>ℹ️</span> {current.note}
            </p>
          </div>
        </div>
      );
    };

    // --- INTERACTIVE TOOL 2: SAVINGS CALCULATOR ---
    const SavingsCalculator = () => {
      const [repoSizeGb, setRepoSizeGb] = useState(2.5);
      const [workspaceCount, setWorkspaceCount] = useState(3);
      const [networkMbps, setNetworkMbps] = useState(50);

      const tradBandwidth = (workspaceCount * repoSizeGb).toFixed(1);
      const tradDisk = (workspaceCount * repoSizeGb).toFixed(1);
      const tradTimeSec = Math.round((workspaceCount * repoSizeGb * 8192) / networkMbps);

      const contribCacheGb = repoSizeGb * 0.058;
      const contribWorktreesGb = workspaceCount * 0.025;
      const contribBandwidth = (contribCacheGb + (workspaceCount * 0.003)).toFixed(2);
      const contribDisk = (contribCacheGb + contribWorktreesGb).toFixed(2);
      const contribTimeSec = Math.max(1.2, Math.round((contribCacheGb * 8192) / networkMbps) + ((workspaceCount - 1) * 0.8));

      const bandwidthSavedPct = (100 - (contribBandwidth / tradBandwidth * 100)).toFixed(1);
      const diskSavedPct = (100 - (contribDisk / tradDisk * 100)).toFixed(1);

      const formatTime = (sec) => {
        if (sec < 60) return `${sec}s`;
        const mins = Math.floor(sec / 60);
        const rem = sec % 60;
        return `${mins}m ${rem > 0 ? rem + 's' : ''}`;
      };

      return (
        <div className="my-8 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-5 sm:p-7 shadow-xs">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-5 border-b border-slate-200 dark:border-slate-800">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-400">
                  <HardDriveIcon className="w-4 h-4" />
                </span>
                <h3 className="text-base font-bold text-slate-900 dark:text-slate-100">
                  Bandwidth & Disk Space Savings Calculator
                </h3>
              </div>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                Simulate how much disk space and network download time <code className="font-mono">gsoc-contrib</code> saves vs traditional <code className="font-mono">git clone</code>.
              </p>
            </div>
            <div className="self-start sm:self-center px-3 py-1 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 font-mono text-xs font-bold rounded-full border border-emerald-200 dark:border-emerald-800">
              Save {bandwidthSavedPct}% Bandwidth
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 my-6">
            <div>
              <div className="flex items-center justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">
                <span>Repository Size</span>
                <span className="font-mono text-blue-600 dark:text-blue-400">{repoSizeGb} GB</span>
              </div>
              <input
                type="range"
                min="0.5"
                max="10.0"
                step="0.5"
                value={repoSizeGb}
                onChange={(e) => setRepoSizeGb(parseFloat(e.target.value))}
                className="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-600"
              />
              <div className="flex justify-between text-[10px] text-slate-400 mt-1 font-mono">
                <span>0.5 GB</span>
                <span>5 GB</span>
                <span>10 GB</span>
              </div>
            </div>

            <div>
              <div className="flex items-center justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">
                <span>Active Workspaces</span>
                <span className="font-mono text-blue-600 dark:text-blue-400">{workspaceCount} issues</span>
              </div>
              <input
                type="range"
                min="1"
                max="8"
                step="1"
                value={workspaceCount}
                onChange={(e) => setWorkspaceCount(parseInt(e.target.value))}
                className="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-600"
              />
              <div className="flex justify-between text-[10px] text-slate-400 mt-1 font-mono">
                <span>1 workspace</span>
                <span>4</span>
                <span>8 workspaces</span>
              </div>
            </div>

            <div>
              <div className="flex items-center justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">
                <span>Download Speed</span>
                <span className="font-mono text-blue-600 dark:text-blue-400">{networkMbps} Mbps</span>
              </div>
              <div className="grid grid-cols-4 gap-1.5">
                {[15, 50, 100, 300].map(speed => (
                  <button
                    key={speed}
                    onClick={() => setNetworkMbps(speed)}
                    className={`py-1 rounded text-xs font-mono font-semibold cursor-pointer border transition-colors ${
                      networkMbps === speed
                        ? 'bg-blue-600 text-white border-blue-600'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700'
                    }`}
                  >
                    {speed}M
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
            <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800">
              <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Bandwidth Downloaded</div>
              <div className="flex items-baseline gap-2">
                <span className="text-2xl font-bold text-emerald-600 dark:text-emerald-400 font-mono">{contribBandwidth} GB</span>
                <span className="text-xs text-slate-400 line-through font-mono">{tradBandwidth} GB</span>
              </div>
              <div className="mt-2 text-xs text-slate-500 dark:text-slate-400">
                <strong>{bandwidthSavedPct}%</strong> bandwidth saved
              </div>
            </div>

              <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Disk Space Consumed</div>

    const GoogleDocsFindBar = ({ isOpen, onClose }) => {
      const [findText, setFindText] = useState('');
      const [matchCount, setMatchCount] = useState(0);
      const [currentMatch, setCurrentMatch] = useState(0);
      const findInputRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          setTimeout(() => {
            findInputRef.current?.focus();
            findInputRef.current?.select();
          }, 50);
        } else {
          clearHighlights();
          setFindText('');
          setMatchCount(0);
          setCurrentMatch(0);
        }
      }, [isOpen]);

      const clearHighlights = () => {
        const main = document.querySelector('main');
        if (!main) return;
        const marks = main.querySelectorAll('mark.gdoc-match');
        marks.forEach(mark => {
          const parent = mark.parentNode;
          if (parent) {
            parent.replaceChild(document.createTextNode(mark.textContent), mark);
            parent.normalize();
          }
        });
      };

      const performSearch = (text, targetIdx = 0) => {
        clearHighlights();
        const clean = text.trim();
        if (!clean || clean.length < 2) {
          setMatchCount(0);
          setCurrentMatch(0);
          return;
        }

        const main = document.querySelector('main');
        if (!main) return;

        const walker = document.createTreeWalker(
          main,
          NodeFilter.SHOW_TEXT,
          {
            acceptNode: (node) => {
              if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
              const parent = node.parentElement;
              if (!parent) return NodeFilter.FILTER_REJECT;
              const tag = parent.tagName.toLowerCase();
              if (['script', 'style', 'input', 'textarea', 'button'].includes(tag)) {
                return NodeFilter.FILTER_REJECT;
              }
              if (parent.closest('button') || parent.closest('.no-search')) {
                return NodeFilter.FILTER_REJECT;
              }
              return NodeFilter.FILTER_ACCEPT;
            }
          }
        );

        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) {
          textNodes.push(node);
        }

        const regex = new RegExp(clean.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        const matches = [];

        textNodes.forEach(textNode => {
          const content = textNode.nodeValue;
          if (!regex.test(content)) return;
          regex.lastIndex = 0;

          const fragment = document.createDocumentFragment();
          let lastIdx = 0;
          let m;

          while ((m = regex.exec(content)) !== null) {
            if (m.index > lastIdx) {
              fragment.appendChild(document.createTextNode(content.substring(lastIdx, m.index)));
            }

            const mark = document.createElement('mark');
            mark.className = 'gdoc-match bg-amber-200 dark:bg-amber-400/90 text-slate-900 font-medium px-0.5 rounded-2xs transition-colors';
            mark.textContent = m[0];
            fragment.appendChild(mark);
            matches.push(mark);

            lastIdx = regex.lastIndex;
          }

          if (lastIdx < content.length) {
            fragment.appendChild(document.createTextNode(content.substring(lastIdx)));
          }

          if (textNode.parentNode) {
            textNode.parentNode.replaceChild(fragment, textNode);
          }
        });

        setMatchCount(matches.length);

        if (matches.length > 0) {
          const safeIdx = ((targetIdx % matches.length) + matches.length) % matches.length;
          setCurrentMatch(safeIdx);
          highlightActiveMatch(matches, safeIdx);
        } else {
          setCurrentMatch(0);
        }
      };

      const highlightActiveMatch = (allMarks, activeIdx) => {
        allMarks.forEach((m, i) => {
          if (i === activeIdx) {
            m.className = 'gdoc-match bg-amber-500 text-white font-bold px-1 rounded-xs ring-2 ring-amber-600 scale-105 inline-block transition-transform';
            m.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            m.className = 'gdoc-match bg-amber-200 dark:bg-amber-400/90 text-slate-900 font-medium px-0.5 rounded-2xs transition-colors';
          }
        });
      };

      const handleTextChange = (e) => {
        const val = e.target.value;
        setFindText(val);
        performSearch(val, 0);
      };

      const goToNext = () => {
        if (matchCount === 0) return;
        const next = (currentMatch + 1) % matchCount;
        setCurrentMatch(next);
        const marks = document.querySelectorAll('mark.gdoc-match');
        highlightActiveMatch(Array.from(marks), next);
      };

      const goToPrev = () => {
        if (matchCount === 0) return;
        const prev = (currentMatch - 1 + matchCount) % matchCount;
        setCurrentMatch(prev);
        const marks = document.querySelectorAll('mark.gdoc-match');
        highlightActiveMatch(Array.from(marks), prev);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (e.shiftKey) {
            goToPrev();
          } else {
            goToNext();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          onClose();
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed top-20 right-4 sm:right-8 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-300 dark:border-slate-700 shadow-2xl rounded-xl p-2 flex items-center gap-2 text-xs animate-in fade-in slide-in-from-top-2 duration-150">

            <input

              type="text"
              value={findText}
              onChange={handleTextChange}
              onKeyDown={handleKeyDown}
              placeholder="Find in document..."
              className="w-32 sm:w-48 bg-transparent text-xs text-slate-900 dark:text-slate-100 focus:outline-none placeholder-slate-400"
            />
            {findText && (
              <button

                className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-0.5 cursor-pointer"

                <CloseIcon className="w-3 h-3" />

          <div className="text-[11px] font-mono font-semibold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded text-slate-700 dark:text-slate-300 min-w-[58px] text-center select-none">
            {findText.trim().length >= 2 ? (
              matchCount > 0 ? `${currentMatch + 1}/${matchCount}` : '0 of 0'
            ) : (
              '0 found'
            )}
          </div>

          <div className="flex items-center gap-0.5 border-l border-slate-200 dark:border-slate-700 pl-1">
            <button
              onClick={goToPrev}
              disabled={matchCount === 0}
              className="p-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent rounded cursor-pointer transition-colors"
              title="Previous match (Shift+Enter)"
            >
              <ChevronUpIcon className="w-3.5 h-3.5" />
            </button>
            <button
              onClick={goToNext}

              className="p-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent rounded cursor-pointer transition-colors"
              title="Next match (Enter)"
            >
              <ChevronDownIcon className="w-3.5 h-3.5" />
            </button>
          </div>

            className="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded ml-1 cursor-pointer transition-colors"
            title="Close find bar (Esc)"
          >
            <CloseIcon className="w-3.5 h-3.5" />
          </button>
        </div>
      );

                  When traveling, on unstable Wi-Fi, or working offline, <code className="font-mono text-xs">gsoc-contrib</code> falls back to locally cached bare repositories in <code className="font-mono text-xs">~/.contrib/cache/</code>. Worktrees can be spawned and switched completely offline without network round-trips.
                </p>
                <CodeBlock code="contrib start psf/requests#6000 --offline" />
              </section>

              {/* Architecture & Visualizer */}
              <section id="architecture" className="mb-16 pt-6 border-t border-slate-100 dark:border-slate-800 scroll-mt-24">
                <div className="text-xs font-semibold uppercase tracking-wider text-purple-600 dark:text-purple-400 mb-1 font-mono">
                  Architecture
                </div>
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100 mb-4">
                  Blobless Git Architecture
                </h2>
                <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-4">
                  Traditional git clones download the entire history of every file ever committed. <code className="font-mono text-xs">gsoc-contrib</code> maintains a single centralized bare cache using Git's blobless filter (<code className="font-mono text-xs">--filter=blob:none</code>) and branches workspaces using <code className="font-mono text-xs">git worktree</code>.
                </p>

                {/* Embedded Architecture Visualizer */}
                <ArchitectureVisualizer />
              </section>

              {/* Privacy & Security */}
              <section id="privacy-security" className="mb-16 pt-6 border-t border-slate-100 dark:border-slate-800 scroll-mt-24">
                <div className="text-xs font-semibold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-1 font-mono">
                  Security Guarantee
                </div>
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100 mb-4">Privacy & Security Policy</h2>
                
                <Callout type="security" title="Zero Telemetry & Local Containment">
                  `gsoc-contrib` is built with a strict privacy-first, local-first architecture. It does NOT collect, transmit, store, or log personal information, IP addresses, tracking metrics, or crash telemetry.
                </Callout>

                <div className="space-y-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed mt-4">
                  <p>
                    <strong>No External Backend:</strong> There are no servers, telemetry beacons, or databases operated by this project. Repository contents and diffs are never transmitted to any third-party server.
                  </p>
                  <p>
                    <strong>In-Memory Token Lifecycle:</strong> GitHub authentication tokens (<code className="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">GITHUB_TOKEN</code>, <code className="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">GH_TOKEN</code>, or <code className="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">gh auth token</code>) are held in memory only for the duration of the command and transmitted strictly over HTTPS directly to GitHub's official REST API (<code className="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">https://api.github.com</code>).
                  </p>
                  <p>
                    <strong>Automated Credential Redaction:</strong> Built-in scrubbers automatically redact GitHub Personal Access Tokens (<code className="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">ghp_*</code>), fine-grained tokens (<code className="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">github_pat_*</code>), and embedded git credentials from all logs, error messages, and terminal outputs.
                  </p>
                  <p>
                    <strong>Strict Argument Parameterization:</strong> All Git and subprocess invocations execute with <code className="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">shell: false</code> to prevent shell injection attacks.
                  </p>
                </div>
              </section>

              {/* Network Audit Table */}
              <section id="network-audit" className="mb-16 pt-6 border-t border-slate-100 dark:border-slate-800 scroll-mt-24">
                <h3 className="text-xl font-bold text-slate-900 dark:text-slate-100 mb-3">Network Request Audit</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">All outbound network requests are strictly limited to official GitHub endpoints or Git remotes:</p>

                <div className="overflow-x-auto">
                  <table className="w-full text-xs text-left border border-slate-200 dark:border-slate-800 rounded-lg">
                    <thead className="bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-semibold">
                      <tr>
                        <th className="p-2.5">Endpoint / Operation</th>
                        <th className="p-2.5">Protocol</th>
                        <th className="p-2.5">Why It Exists</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-mono text-slate-800 dark:text-slate-200">
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900 dark:text-slate-100">GET /repos/{'{owner}/{repo}'}/issues/{'{num}'}</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Retrieves public issue title, description body, labels, and author</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900 dark:text-slate-100">GET /user</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Identifies authenticated username to check for existing personal forks</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900 dark:text-slate-100">GET /repos/{'{user}/{repo}'}</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Checks if the user has a fork of the target repo to wire remotes</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900 dark:text-slate-100">POST /repos/{'{owner}/{repo}'}/forks</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Creates a user fork on GitHub when --fork is specified</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900 dark:text-slate-100">GET /search/issues</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Powers `contrib search` and `contrib browse` for good first issues</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900 dark:text-slate-100">GET /rate_limit</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Powers `contrib init` and `contrib doctor` to display remaining quota</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900 dark:text-slate-100">git clone / fetch / push</td>
                        <td className="p-2.5 font-sans">Git/SSH/HTTPS</td>
                        <td className="p-2.5 font-sans">Standard Git operations communicating directly with target GitHub repository</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </main>
          </div>

          {/* Docs Footer */}
          <footer className="border-t border-slate-200 dark:border-slate-800 py-8 px-6 text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-950">

                <span className="font-semibold text-slate-800 dark:text-slate-200">gsoc-contrib (`contrib`)</span>
                <span>— Open source contribution workspace manager under MIT License</span>
              </div>
              <div className="flex items-center gap-4">
                <a href="https://github.com/anandmahadevv/contrib-cli" className="hover:underline">GitHub</a>
                <a href="https://www.npmjs.com/package/gsoc-contrib" className="hover:underline">npm</a>
                <a href="https://github.com/anandmahadevv/contrib-cli/blob/main/SECURITY.md" className="hover:underline">Security</a>
              </div>
            </div>
          </footer>
        </div>
