    const ChevronDownIcon = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="6 9 12 15 18 9" />

    const HighlightText = ({ text, highlight }) => {
      if (!highlight || !highlight.trim()) return <span>{text}</span>;
      const terms = highlight.trim().split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (terms.length === 0) return <span>{text}</span>;
      const regex = new RegExp(`(${terms.join('|')})`, 'gi');
      const parts = text.split(regex);
      return (
        <span>
          {parts.map((part, i) =>
            regex.test(part) ? (
              <mark key={i} className="bg-amber-200/90 text-slate-900 font-semibold px-0.5 rounded-xs">
                {part}
              </mark>
            ) : (
              part
            )
          )}
        </span>
      );
    };

    const CopyIcon = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>
    );

    const CheckIcon = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    );

    const CodeBlock = ({ code, language = "bash" }) => {
      const [copied, setCopied] = useState(false);

      const onCopy = () => {
        navigator.clipboard.writeText(code);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="relative my-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-100 overflow-hidden font-mono text-sm shadow-xs group">
          <div className="flex items-center justify-between px-4 py-2 bg-slate-950/60 border-b border-slate-800 text-xs text-slate-400">
            <span>{language}</span>
            <button
              onClick={onCopy}
              className="flex items-center gap-1 text-slate-400 hover:text-white transition-colors py-0.5 px-2 rounded hover:bg-slate-800"
            >
              {copied ? (
                <>
                  <CheckIcon className="w-3.5 h-3.5 text-emerald-400" />
                  <span className="text-emerald-400">Copied</span>
                </>
              ) : (
                <>
                  <CopyIcon className="w-3.5 h-3.5" />
                  <span>Copy</span>
                </>
              )}
            </button>
          </div>
          <pre className="p-4 overflow-x-auto text-xs sm:text-sm leading-relaxed">
            <code>{code}</code>
          </pre>
        </div>
      );
    };

    const Callout = ({ type = "note", title, children }) => {
      const styles = {
        note: "bg-blue-50/60 border-blue-200 text-blue-900",
        tip: "bg-emerald-50/60 border-emerald-200 text-emerald-900",
        warning: "bg-amber-50/60 border-amber-200 text-amber-900",
        security: "bg-purple-50/60 border-purple-200 text-purple-900",
      };

      return (
        <div className={`my-5 p-4 rounded-xl border ${styles[type]} text-sm leading-relaxed`}>
          {title && <div className="font-semibold mb-1 text-xs uppercase tracking-wider">{title}</div>}
          <div>{children}</div>
        </div>
      );
    };

    const SEARCH_INDEX = [
      {

    const SearchModal = ({ isOpen, onClose, onSelect, onOpenFindInPage }) => {
      const [query, setQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedIndex, setSelectedIndex] = useState(0);
      const inputRef = useRef(null);

      const categories = ['All', 'Workspace', 'Git & PR', 'Discovery', 'Diagnostics', 'Architecture', 'Security'];

      useEffect(() => {
        if (isOpen) {
          setQuery('');
          setSelectedCategory('All');
          setSelectedIndex(0);
          setTimeout(() => inputRef.current?.focus(), 50);
        }
      }, [isOpen]);

      const results = useMemo(() => {
        let pool = SEARCH_INDEX;
        if (selectedCategory !== 'All') {
          pool = pool.filter(x => x.category.toLowerCase().includes(selectedCategory.toLowerCase()));
        }

        const q = query.trim().toLowerCase();
        if (!q) {
          return pool.slice(0, 6);
        }

        const terms = q.split(/\s+/).filter(Boolean);
        return pool.filter(item => {
          const haystack = `${item.title} ${item.category} ${item.keywords} ${item.description}`.toLowerCase();
          return terms.every(t => haystack.includes(t));
        }).slice(0, 8);
      }, [query, selectedCategory]);

      useEffect(() => {
        setSelectedIndex(0);
      }, [results]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIndex(prev => (prev + 1) % Math.max(1, results.length));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIndex(prev => (prev - 1 + results.length) % Math.max(1, results.length));
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (results[selectedIndex]) {
            onSelect(results[selectedIndex].id);
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          onClose();
        }
      };

      if (!isOpen) return null;

      return (
        <div 
          className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-md flex items-start justify-center pt-16 sm:pt-24 px-4"
          onClick={onClose}
        >
          <div 
            className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden flex flex-col max-h-[85vh] transition-all"
            onClick={(e) => e.stopPropagation()}
            onKeyDown={handleKeyDown}
          >
            {/* Search Input Row */}
            <div className="flex items-center px-4 py-3.5 border-b border-slate-100 bg-slate-50/70 gap-3">
              <SearchIcon className="w-5 h-5 text-slate-400 shrink-0" />
              <input
                ref={inputRef}
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search commands, flags, architecture, guides..."
                className="w-full bg-transparent text-sm sm:text-base text-slate-900 placeholder-slate-400 focus:outline-none"
              />
              {query && (
                <button 
                  onClick={() => setQuery('')}
                  className="p-1 text-slate-400 hover:text-slate-600 rounded-md hover:bg-slate-200/60 transition-colors cursor-pointer"
                  title="Clear search"
                >
                  <CloseIcon className="w-4 h-4" />
                </button>
              )}
              <kbd className="hidden sm:inline-block text-[10px] font-mono font-semibold bg-slate-200/80 text-slate-600 px-1.5 py-0.5 rounded border border-slate-300">
                ESC
              </kbd>
            </div>

            {/* Category Filter Tabs */}
            <div className="flex items-center gap-1.5 px-4 py-2 bg-slate-50/80 border-b border-slate-100 overflow-x-auto text-xs">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-2.5 py-1 rounded-lg font-medium transition-all text-[11px] whitespace-nowrap cursor-pointer ${
                    selectedCategory === cat 
                      ? 'bg-slate-900 text-white shadow-2xs' 
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            {/* Results Header */}
            <div className="px-4 py-1.5 bg-slate-100/50 border-b border-slate-100 text-[11px] font-semibold text-slate-500 uppercase tracking-wider flex items-center justify-between">
              <span>{query.trim() ? `Found ${results.length} results` : 'Popular Searches & Topics'}</span>
              <span className="font-mono text-slate-400 lowercase font-normal">{selectedCategory}</span>
            </div>

            {/* Results List */}
            <div className="overflow-y-auto p-2 divide-y divide-slate-50 max-h-96">
              {results.length === 0 ? (
                <div className="py-12 text-center text-sm text-slate-500">
                  <div className="text-slate-400 mb-2 font-medium">No documentation found for "{query}"</div>
                  <div className="text-xs text-slate-400">
                    Try searching for <span className="text-slate-700 font-mono">start</span>, <span className="text-slate-700 font-mono">sparse</span>, <span className="text-slate-700 font-mono">worktree</span>, <span className="text-slate-700 font-mono">doctor</span>, or switch category.
                  </div>
                </div>
              ) : (
                results.map((item, idx) => (
                  <button
                    key={item.id}
                    onClick={() => onSelect(item.id)}
                    onMouseEnter={() => setSelectedIndex(idx)}
                    className={`w-full text-left p-3 rounded-xl transition-all flex items-start gap-3 group cursor-pointer ${
                      idx === selectedIndex 
                        ? 'bg-slate-900 text-white shadow-xs' 
                        : 'hover:bg-slate-50 text-slate-800'
                    }`}
                  >
                    <div className={`mt-0.5 p-2 rounded-lg shrink-0 ${
                      idx === selectedIndex ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600'
                    }`}>
                      {item.badge === 'Command' ? (
                        <TerminalIcon className="w-4 h-4" />
                      ) : (
                        <DocumentIcon className="w-4 h-4" />
                      )}
                    </div>

                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded font-mono uppercase tracking-wider ${
                          idx === selectedIndex 
                            ? 'bg-slate-800 text-slate-300' 
                            : 'bg-slate-100 text-slate-600'
                        }`}>
                          {item.category}
                        </span>
                        <h4 className="text-sm font-semibold truncate tracking-tight">
                          <HighlightText text={item.title} highlight={query} />
                        </h4>
                      </div>
                      <p className={`text-xs line-clamp-1 leading-normal ${
                        idx === selectedIndex ? 'text-slate-300' : 'text-slate-500'
                      }`}>
                        <HighlightText text={item.description} highlight={query} />
                      </p>
                    </div>

                    <div className={`shrink-0 self-center ${
                      idx === selectedIndex ? 'text-slate-200' : 'text-slate-300 group-hover:text-slate-500'
                    }`}>
                      <CornerDownLeftIcon className="w-4 h-4" />
                    </div>
                  </button>
                ))
              )}
            </div>

            {/* Modal Footer with Google Docs Find switch */}
            <div className="px-4 py-2.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
              <div className="flex items-center gap-3">
                <span className="flex items-center gap-1">
                  <kbd className="bg-white border border-slate-200 px-1 rounded shadow-2xs font-mono text-[10px]">↑</kbd>
                  <kbd className="bg-white border border-slate-200 px-1 rounded shadow-2xs font-mono text-[10px]">↓</kbd>
                  <span>navigate</span>
                </span>
                <span className="flex items-center gap-1">

    const GoogleDocsFindBar = ({ isOpen, onClose }) => {
      const [findText, setFindText] = useState('');
      const [matchCount, setMatchCount] = useState(0);
      const [currentMatch, setCurrentMatch] = useState(0);
      const findInputRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          setTimeout(() => {
            findInputRef.current?.focus();
            findInputRef.current?.select();
          }, 50);
        } else {
          clearHighlights();
          setFindText('');
          setMatchCount(0);
          setCurrentMatch(0);
        }
      }, [isOpen]);

      const clearHighlights = () => {
        const main = document.querySelector('main');
        if (!main) return;
        const marks = main.querySelectorAll('mark.gdoc-match');
        marks.forEach(mark => {
          const parent = mark.parentNode;
          if (parent) {
            parent.replaceChild(document.createTextNode(mark.textContent), mark);
            parent.normalize();
          }
        });
      };

      const performSearch = (text, targetIdx = 0) => {
        clearHighlights();
        const clean = text.trim();
        if (!clean || clean.length < 2) {
          setMatchCount(0);
          setCurrentMatch(0);
          return;
        }

        const main = document.querySelector('main');
        if (!main) return;

        const regex = new RegExp(`(${clean.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.textContent.trim()) return NodeFilter.FILTER_REJECT;
            const tag = node.parentElement?.tagName;
            if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA') {
              return NodeFilter.FILTER_REJECT;
            }
            return regex.test(node.textContent) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
          }
        });

        const textNodes = [];
        while (walker.nextNode()) {
          textNodes.push(walker.currentNode);
        }

        let count = 0;
        textNodes.forEach(node => {
          const parent = node.parentNode;
          if (!parent) return;
          const textVal = node.textContent;
          const parts = textVal.split(regex);
          const fragment = document.createDocumentFragment();

          parts.forEach(part => {
            if (part.toLowerCase() === clean.toLowerCase()) {
              const mark = document.createElement('mark');
              mark.className = `gdoc-match px-0.5 rounded transition-all duration-150 ${
                count === targetIdx 
                  ? 'bg-amber-400 text-slate-900 font-bold ring-2 ring-amber-500 ring-offset-1 z-10 relative shadow-xs' 
                  : 'bg-amber-200/90 text-slate-900'
              }`;
              mark.dataset.matchIndex = count;
              mark.textContent = part;
              fragment.appendChild(mark);
              count++;
            } else if (part) {
              fragment.appendChild(document.createTextNode(part));
            }
          });

          parent.replaceChild(fragment, node);
        });

        setMatchCount(count);
        if (count > 0) {
          const boundedIndex = Math.min(targetIdx, count - 1);
          setCurrentMatch(boundedIndex);
          const activeEl = main.querySelector(`mark.gdoc-match[data-match-index="${boundedIndex}"]`);
          if (activeEl) {
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else {
          setCurrentMatch(0);
        }
      };

      const handleTextChange = (e) => {
        const val = e.target.value;
        setFindText(val);
        performSearch(val, 0);
      };

      const goToNext = () => {
        if (matchCount === 0) return;
        const nextIndex = (currentMatch + 1) % matchCount;
        updateActiveMatch(nextIndex);
      };

      const goToPrev = () => {
        if (matchCount === 0) return;
        const prevIndex = (currentMatch - 1 + matchCount) % matchCount;
        updateActiveMatch(prevIndex);
      };

      const updateActiveMatch = (newIndex) => {
        setCurrentMatch(newIndex);
        const main = document.querySelector('main');
        if (!main) return;
        const marks = main.querySelectorAll('mark.gdoc-match');
        marks.forEach((mark, idx) => {
          if (idx === newIndex) {
            mark.className = 'gdoc-match px-0.5 rounded transition-all duration-150 bg-amber-400 text-slate-900 font-bold ring-2 ring-amber-500 ring-offset-1 z-10 relative shadow-xs';
            mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            mark.className = 'gdoc-match px-0.5 rounded transition-all duration-150 bg-amber-200/90 text-slate-900';
          }
        });
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (e.shiftKey) {
            goToPrev();
          } else {
            goToNext();
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          onClose();
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed top-20 right-4 sm:right-8 z-40 bg-white/95 backdrop-blur-md border border-slate-300 shadow-2xl rounded-xl p-2 flex items-center gap-2 text-xs animate-in fade-in slide-in-from-top-2 duration-150">
          <div className="flex items-center gap-1.5 pl-2 pr-2 py-1 bg-slate-50 border border-slate-200 rounded-lg focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition-all">
            <SearchIcon className="w-3.5 h-3.5 text-slate-400" />
            <input
              ref={findInputRef}
              type="text"
              value={findText}
              onChange={handleTextChange}
              onKeyDown={handleKeyDown}
              placeholder="Find in document..."
              className="w-32 sm:w-48 bg-transparent text-xs text-slate-900 focus:outline-none placeholder-slate-400"
            />
            {findText && (
              <button
                onClick={() => { setFindText(''); clearHighlights(); setMatchCount(0); setCurrentMatch(0); }}
                className="text-slate-400 hover:text-slate-600 p-0.5 cursor-pointer"
                title="Clear"
              >
                <CloseIcon className="w-3 h-3" />
              </button>
            )}
          </div>

          <div className="text-[11px] font-mono font-semibold px-2 py-1 bg-slate-100 rounded text-slate-700 min-w-[58px] text-center select-none">
            {findText.trim().length >= 2 ? (
              matchCount > 0 ? `${currentMatch + 1}/${matchCount}` : '0 of 0'
            ) : (
              '0 found'
            )}
          </div>

          <div className="flex items-center gap-0.5 border-l border-slate-200 pl-1">
            <button
              onClick={goToPrev}
              disabled={matchCount === 0}
              className="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-transparent rounded cursor-pointer transition-colors"
              title="Previous match (Shift+Enter)"
            >
              <ChevronUpIcon className="w-3.5 h-3.5" />
            </button>
            <button
              onClick={goToNext}
              disabled={matchCount === 0}
              className="p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-transparent rounded cursor-pointer transition-colors"
              title="Next match (Enter)"
            >
              <ChevronDownIcon className="w-3.5 h-3.5" />
            </button>
          </div>

          <button
            onClick={onClose}
            className="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded ml-1 cursor-pointer transition-colors"
            title="Close find bar (Esc)"
          >
            <CloseIcon className="w-3.5 h-3.5" />
          </button>
        </div>
      );
    };

                  <div>
                    <h3 className="text-base font-bold text-slate-900 mb-1">5. Synchronize with Upstream Changes</h3>
                    <p className="text-sm text-slate-600 mb-2">Fetch and rebase your branch on upstream/main at any time:</p>
                    <CodeBlock code="contrib sync --push" />
                  </div>

                  <div>
                    <h3 className="text-base font-bold text-slate-900 mb-1">6. Submit Your Pull Request</h3>
                    <p className="text-sm text-slate-600 mb-2">Verify clean working trees and generate a 1-click GitHub PR link:</p>
                    <CodeBlock code="contrib submit" />
                  </div>
                </div>
              </section>

              {/* Command: start */}
              <section id="cmd-start" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <div className="text-xs font-semibold uppercase tracking-wider text-blue-600 mb-1 font-mono">
                  Command Reference
                </div>
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib start</h2>
                <div className="text-xs text-slate-500 font-mono mb-4">Alias: contrib contribute</div>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Initializes a dedicated workspace for a specific GitHub issue or pull request. Downloads only commit trees, creates an isolated branch, parses the issue text to detect candidate source files, and writes <code className="font-mono text-xs">.contrib/ISSUE.md</code> and <code className="font-mono text-xs">.contrib/AI_PROMPT.md</code>.
                </p>

                <CodeBlock code="contrib start <url-or-shorthand> [options]" />

                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mt-6 mb-3">Options & Flags</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs text-left border border-slate-200 rounded-lg">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-700 font-semibold">
                      <tr>
                        <th className="p-2.5">Flag</th>
                        <th className="p-2.5">Description</th>
                        <th className="p-2.5">Default</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-b, --branch &lt;name&gt;</td>
                        <td className="p-2.5 font-sans">Custom branch name to create</td>
                        <td className="p-2.5 text-slate-500">issue_&lt;num&gt;</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-w, --worktree</td>
                        <td className="p-2.5 font-sans">Use shared bare repository cache with git worktree for sub-second setup</td>
                        <td className="p-2.5 text-slate-500">false</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-s, --sparse [dirs]</td>
                        <td className="p-2.5 font-sans">Enable cone sparse checkout for specific directories</td>
                        <td className="p-2.5 text-slate-500">auto</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-m, --mode &lt;mode&gt;</td>
                        <td className="p-2.5 font-sans">Clone mode: blobless, treeless, shallow, or worktree</td>
                        <td className="p-2.5 text-slate-500">blobless</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-i, --install</td>
                        <td className="p-2.5 font-sans">Automatically detect stack and install dependencies</td>
                        <td className="p-2.5 text-slate-500">false</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-o, --open</td>
                        <td className="p-2.5 font-sans">Open workspace in default editor immediately</td>
                        <td className="p-2.5 text-slate-500">false</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-a, --antigravity</td>
                        <td className="p-2.5 font-sans">Open in Google Antigravity IDE (--ide, --agy)</td>
                        <td className="p-2.5 text-slate-500">false</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">-c, --code</td>
                        <td className="p-2.5 font-sans">Open in Visual Studio Code</td>
                        <td className="p-2.5 text-slate-500">false</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">--cursor</td>
                        <td className="p-2.5 font-sans">Open in Cursor</td>
                        <td className="p-2.5 text-slate-500">false</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">--offline</td>
                        <td className="p-2.5 font-sans">Operate completely offline using cached metadata and bare mirrors</td>
                        <td className="p-2.5 text-slate-500">false</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div className="mt-4">
                  <span className="text-xs font-semibold text-slate-700">Example:</span>
                  <CodeBlock code="contrib start psf/requests#6000 --worktree --install --cursor" />
                </div>
              </section>

              {/* Command: open */}
              <section id="cmd-open" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib open</h2>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Launches your active contribution workspace in an editor or browser. When run inside an active workspace, automatically detects the current workspace. When multiple exist, provides interactive selection.
                </p>
                <CodeBlock code="contrib open [workspace-id] [options]" />

                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mt-4 mb-2">Supported Editor Flags</h4>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-mono text-slate-700">
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--code (VS Code)</div>
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--cursor (Cursor)</div>
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--antigravity (AGY)</div>
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--nvim (Neovim)</div>
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--vim (Vim)</div>
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--helix (Helix)</div>
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--zed (Zed)</div>
                  <div className="p-2 bg-slate-50 rounded border border-slate-200">--web (Browser)</div>
                </div>

                <Callout type="tip" title="Shell Integration Tip">
                  Use <code className="font-mono text-xs">contrib open -p</code> to print only the path. You can jump directly in your terminal using:
                  <code className="block mt-1 font-mono text-xs bg-white/70 p-1.5 rounded">cd $(contrib open psf/requests#6000 -p)</code>
                </Callout>
              </section>

              {/* Command: dashboard */}
              <section id="cmd-dashboard" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib dashboard</h2>
                <div className="text-xs text-slate-500 font-mono mb-4">Aliases: contrib dash, contrib tui</div>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  A zero-dependency, full-screen interactive Terminal User Interface (TUI) with single-keystroke operations.
                </p>
                <CodeBlock code="contrib dashboard" />

                <div className="bg-slate-950 text-slate-200 p-4 rounded-xl font-mono text-xs my-4 leading-relaxed">
                  <div className="text-slate-400 border-b border-slate-800 pb-2 mb-2 font-bold">
                    CONTRIB WORKSPACE DASHBOARD (Active: 3)
                  </div>
                  <div>❯ [1] psf__requests__issue_6000  (branch: fix-header) [Clean]  14.2 MB</div>
                  <div className="text-slate-500">  [2] facebook__react__issue_24000 (branch: use-hook)   [Dirty]  28.1 MB</div>
                  <div className="text-slate-500">  [3] torvalds__linux__issue_100   (branch: memory-fix) [Clean]  120 MB</div>
                  <div className="mt-4 pt-2 border-t border-slate-800 text-slate-400 text-[11px]">
                    [o] Open Editor | [s] Sync Upstream | [d] Diff | [c] Cleanup | [q] Quit
                  </div>
                </div>
              </section>

              {/* Command: sync */}
              <section id="cmd-sync" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib sync</h2>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Fetches the latest upstream commits from GitHub and cleanly rebases your issue branch on top of `upstream/main` (or default branch). Automatically aborts safely if merge conflicts occur.
                </p>
                <CodeBlock code="contrib sync [workspace-id] [--push]" />
                <p className="text-xs text-slate-500">Passing <code className="font-mono">--push</code> automatically pushes the rebased branch to your personal fork (<code className="font-mono">origin</code>).</p>
              </section>

              {/* Command: submit */}
              <section id="cmd-submit" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib submit</h2>
                <div className="text-xs text-slate-500 font-mono mb-4">Alias: contrib pr</div>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Assists in submitting your work as a GitHub Pull Request. Verifies working tree status, prompts you to commit uncommitted files, pushes your branch to your personal fork, and generates a pre-filled PR link or GitHub CLI command.
                </p>
                <CodeBlock code="contrib submit [workspace-id] [--title <title>] [--body <body>]" />
              </section>

              {/* Command: identity */}
              <section id="cmd-identity" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib identity</h2>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Manage multiple Git and SSH identities (e.g. personal, company, open-source) and apply them on a per-workspace basis without altering your global `~/.gitconfig`.
                </p>

                <div className="space-y-4">
                  <div>
                    <span className="text-xs font-semibold text-slate-700">1. Add an identity:</span>
                    <CodeBlock code='contrib identity add personal --name "Jane Doe" --email "jane@personal.com" --ssh-key ~/.ssh/id_ed25519_personal' />
                  </div>
                  <div>
                    <span className="text-xs font-semibold text-slate-700">2. Apply to current workspace:</span>
                    <CodeBlock code="contrib identity use personal" />
                  </div>
                  <div>
                    <span className="text-xs font-semibold text-slate-700">3. List all configured identities:</span>
                    <CodeBlock code="contrib identity list" />
                  </div>
                </div>
              </section>

              {/* Command: doctor */}
              <section id="cmd-doctor" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib doctor</h2>
                <div className="text-xs text-slate-500 font-mono mb-4">Alias: contrib info</div>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Runs complete diagnostic health checks across your environment, git version, storage sizes, and GitHub API authentication.
                </p>
                <CodeBlock code="contrib doctor [workspace-id]" />
                <ul className="list-disc list-inside text-xs text-slate-600 space-y-1">
                  <li>Checks Node.js runtime and Git executable in PATH</li>
                  <li>Inspects GitHub authentication tokens and remaining hourly rate limits</li>
                  <li>Calculates exact disk usage in `~/.contrib/workspaces` and `~/.contrib/cache`</li>
                  <li>Detects project tech stack (Node, Python, Rust, Go) and test commands</li>
                </ul>
              </section>

              {/* Command: alias */}
              <section id="cmd-alias" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-2 font-mono">contrib alias / shell-init</h2>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Generates the <code className="font-mono text-xs">gcd</code> shell function for instant workspace jumping and shell tab-autocompletion across Bash, Zsh, Fish, and PowerShell.
                </p>
                <CodeBlock code="contrib alias --install" />
                <p className="text-xs text-slate-500 mb-2">Once installed, jump into any workspace with tab completion:</p>
                <CodeBlock code="gcd requests<TAB> # instantly cd's to ~/.contrib/workspaces/psf__requests__issue_6000" />
              </section>

              {/* Context Files */}
              <section id="context-files" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <div className="text-xs font-semibold uppercase tracking-wider text-purple-600 mb-1 font-mono">
                  Context Intelligence
                </div>
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-4">Auto-Generated Workspace Files</h2>
                <p className="text-sm text-slate-600 leading-relaxed mb-4">
                  Every workspace automatically generates a hidden <code className="font-mono text-xs">.contrib/</code> directory (excluded from git commits via <code className="font-mono text-xs">.git/info/exclude</code>) containing:
                </p>

                <div className="space-y-4">
                  <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/50">
                    <div className="font-mono font-bold text-sm text-slate-900 mb-1">.contrib/ISSUE.md</div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Complete Markdown representation of the GitHub issue, author, labels, description, extracted candidate file paths, and quick contribution commands.
                    </p>
                  </div>

                  <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/50">
                    <div className="font-mono font-bold text-sm text-slate-900 mb-1">.contrib/AI_PROMPT.md</div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Pre-formatted context prompt tailored for AI coding assistants (Claude Code, Antigravity, Cursor, Copilot) with repository contributing guidelines, style guides, and test scripts.
                    </p>
                  </div>

                  <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/50">
                    <div className="font-mono font-bold text-sm text-slate-900 mb-1">.contrib/context.json</div>
                    <p className="text-xs text-slate-600 leading-relaxed">
                      Machine-readable JSON schema tracking issue metadata, repository timestamps, and stack configurations.
                    </p>
                  </div>
                </div>
              </section>

              {/* Privacy & Security */}
              <section id="privacy-security" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <div className="text-xs font-semibold uppercase tracking-wider text-emerald-600 mb-1 font-mono">
                  Security Guarantee
                </div>
                <h2 className="text-3xl font-bold tracking-tight text-slate-900 mb-4">Privacy & Security Policy</h2>
                
                <Callout type="security" title="Zero Telemetry & Local Containment">
                  `gsoc-contrib` is built with a strict privacy-first, local-first architecture. It does NOT collect, transmit, store, or log personal information, IP addresses, tracking metrics, or crash telemetry.
                </Callout>

                <div className="space-y-3 text-sm text-slate-600 leading-relaxed mt-4">
                  <p>
                    <strong>No External Backend:</strong> There are no servers, telemetry beacons, or databases operated by this project. Repository contents and diffs are never transmitted to any third-party server.
                  </p>
                  <p>
                    <strong>In-Memory Token Lifecycle:</strong> GitHub authentication tokens (<code className="font-mono text-xs">GITHUB_TOKEN</code>, <code className="font-mono text-xs">GH_TOKEN</code>, or <code className="font-mono text-xs">gh auth token</code>) are held in memory only for the duration of the command and transmitted strictly over HTTPS directly to GitHub's official REST API (<code className="font-mono text-xs">https://api.github.com</code>).
                  </p>
                  <p>
                    <strong>Automated Credential Redaction:</strong> Built-in scrubbers automatically redact GitHub Personal Access Tokens (<code className="font-mono text-xs">ghp_*</code>), fine-grained tokens (<code className="font-mono text-xs">github_pat_*</code>), and embedded git credentials from all logs, error messages, and terminal outputs.
                  </p>
                  <p>
                    <strong>Strict Argument Parameterization:</strong> All Git and subprocess invocations execute with <code className="font-mono text-xs">shell: false</code> to prevent shell injection attacks.
                  </p>
                </div>
              </section>

              {/* Network Audit Table */}
              <section id="network-audit" className="mb-16 pt-6 border-t border-slate-100 scroll-mt-24">
                <h3 className="text-xl font-bold text-slate-900 mb-3">Network Request Audit</h3>
                <p className="text-xs text-slate-500 mb-4">All outbound network requests are strictly limited to official GitHub endpoints or Git remotes:</p>

                <div className="overflow-x-auto">
                  <table className="w-full text-xs text-left border border-slate-200 rounded-lg">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-700 font-semibold">
                      <tr>
                        <th className="p-2.5">Endpoint / Operation</th>
                        <th className="p-2.5">Protocol</th>
                        <th className="p-2.5">Why It Exists</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">GET /repos/{'{owner}/{repo}'}/issues/{'{num}'}</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Retrieves public issue title, description body, labels, and author</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">GET /user</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Identifies authenticated username to check for existing personal forks</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">GET /repos/{'{user}/{repo}'}</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Checks if the user has a fork of the target repo to wire remotes</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">POST /repos/{'{owner}/{repo}'}/forks</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Creates a user fork on GitHub when --fork is specified</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">GET /search/issues</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Powers `contrib search` and `contrib browse` for good first issues</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">GET /rate_limit</td>
                        <td className="p-2.5 font-sans">HTTPS</td>
                        <td className="p-2.5 font-sans">Powers `contrib init` and `contrib doctor` to display remaining quota</td>
                      </tr>
                      <tr>
                        <td className="p-2.5 font-bold text-slate-900">git clone / fetch / push</td>
                        <td className="p-2.5 font-sans">Git/SSH/HTTPS</td>
                        <td className="p-2.5 font-sans">Standard Git operations communicating directly with target GitHub repository</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </main>
          </div>

          {/* Docs Footer */}
          <footer className="border-t border-slate-200 py-8 px-6 text-xs text-slate-500 bg-slate-50">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <StarIcon className="w-3.5 h-3.5 text-slate-900 fill-slate-900" />
                <span className="font-semibold text-slate-800">gsoc-contrib (`contrib`)</span>
                <span>— Open source contribution workspace manager under MIT License</span>
              </div>
              <div className="flex items-center gap-4">
                <a href="https://github.com/anandmahadevv/contrib-cli" className="hover:underline">GitHub</a>
                <a href="https://www.npmjs.com/package/gsoc-contrib" className="hover:underline">npm</a>
                <a href="https://github.com/anandmahadevv/contrib-cli/blob/main/SECURITY.md" className="hover:underline">Security</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DocsApp />);
  </script>
</body>
